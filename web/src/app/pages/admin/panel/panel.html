<header class="barra fondo-rotulo">
  <div class="pagina barra__contenido">
    <div>
      <p class="barra__rotulo rotulo letrero"><a class="titulo-enlace" routerLink="/admin">{{ sesion()?.nombreBarberia }}</a></p>
      <a class="barra__publica" [routerLink]="['/b', sesion()?.slug]">Ver mi página de reservas</a>
    </div>
    <button type="button" class="barra__salir" (click)="sesionService.salir()">Salir</button>
  </div>
  <nav class="pagina barra__nav" aria-label="Secciones del panel">
    <a routerLink="/admin" routerLinkActive="activa" [routerLinkActiveOptions]="{ exact: true }" ariaCurrentWhenActive="page">Agenda</a>
    <a routerLink="/admin/servicios" routerLinkActive="activa" ariaCurrentWhenActive="page">Servicios</a>
    <a routerLink="/admin/barberos" routerLinkActive="activa" ariaCurrentWhenActive="page">Barberos</a>
    <a routerLink="/admin/perfil" routerLinkActive="activa" ariaCurrentWhenActive="page">Perfil</a>
    <a routerLink="/admin/compartir" routerLinkActive="activa" ariaCurrentWhenActive="page">Compartir</a>
  </nav>
</header>

<router-outlet />
